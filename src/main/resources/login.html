<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">

    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
          integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" rel="stylesheet">

    <style>
        body {
            font-family: Avenir, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-align: left;
            color: #2c3e50;
        }

        .welcome-message {
            margin-top: -3rem;
        }
    </style>

    <title>Login</title>
</head>
<body>
<div class="container d-flex flex-column justify-content-center align-items-center vh-100">
    <div class="text-center mb-4 welcome-message">
        <h2>Welcome</h2>
        <p>Please sign in to continue</p>
    </div>
    <div class="text-center">
        <form action="/oauth2/authorization/google" method="get">
            <!--redirect-->
            <button class="btn btn-primary btn-lg" type="submit">
                <img alt="Google" class="me-2" height="20" src="https://www.google.com/favicon.ico" width="20">
                Login with Google
            </button>
        </form>
    </div>
</div>


</body>
</html>
