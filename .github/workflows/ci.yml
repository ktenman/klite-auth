name: Build & Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOCKER_IMAGE: ghcr.io/ktenman/klite-auth

jobs:

  test:
    name: 🧪 Test with Gradle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - run: docker compose up -d --wait
      - run: ./gradlew test

  image:
    name: 🔨 Build ${{ matrix.arch }} image
    needs: [ test ]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build native image
        run: docker build -t authbench-app .
      - name: Sign in, validate and log out against the image
        run: IMAGE=authbench-app bench/run.sh
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push ${{ matrix.arch }} image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag authbench-app "$DOCKER_IMAGE:latest-${{ matrix.arch }}"
          docker push "$DOCKER_IMAGE:latest-${{ matrix.arch }}"

  build_and_push:
    name: 🔨 Push multi-arch image
    needs: [ image ]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Combine both arch images as latest
        run: docker buildx imagetools create -t "$DOCKER_IMAGE:latest" "$DOCKER_IMAGE:latest-amd64" "$DOCKER_IMAGE:latest-arm64"

  auto-merge-dependabot:
    name: 🤖 Auto merge dependabot PR
    needs: [ test, image ]
    if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 🤖Merge PR from dependabot
        uses: fastify/github-action-merge-dependabot@v3.15.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          target: minor
          merge-method: rebase
