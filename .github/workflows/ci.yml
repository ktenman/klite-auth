name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6380:6379 # where the tests look, as in compose.yaml
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - run: ./gradlew test
