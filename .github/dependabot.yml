# manual trigger: 2026-11-18T14:33:49Z
version: 2
updates:
  - package-ecosystem: 'gradle'
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 30
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 30
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: monthly
